[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "lapsed"
version = "3.2.0"
description = "Find and remove dead code in Python codebases (Rust implementation)."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "Colin Kennedy", email = "colinvfx@gmail.com" },
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]

[project.urls]
homepage = "https://github.com/albertas/deadcode"
documentation = "https://deadcode.readthedocs.io/"

[tool.maturin]
bindings = "bin"
strip = true
