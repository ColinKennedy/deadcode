# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Checks deadcode package with Python3.10

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        # The Python implementation moved to legacy-python/ during the Rust
        # port (see RUST_PORT_PLAN.md) — this job now checks that reference
        # copy, not the new Rust implementation (see wheels.yml for that).
        working-directory: legacy-python

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        make .venv
    - name: Run checks
      run: |
        make check
