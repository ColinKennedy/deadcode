name: Build Rust wheels

# Wheels are the release artifact, so v* tags must build them -- previously
# tags triggered nothing at all. `pull_request` is unfiltered for the same
# reason as in ci.yml: a base-branch filter means PRs into staging or
# test_release get no wheel build.
on:
  pull_request:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  linux:
    name: wheel (linux ${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  windows:
    name: wheel (windows ${{ matrix.target }})
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target == 'x64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl

  macos:
    name: wheel (macos ${{ matrix.target }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Every wheel installs and runs on its target platform.
  smoke-test:
    name: install & smoke test (${{ matrix.os }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Runner and artifact are paired explicitly rather than derived from the
      # OS name. A wheel only installs on a matching architecture, and the
      # previous nested-ternary form hardcoded macos-x86_64 -- which broke once
      # `macos-latest` became Apple Silicon (macos-26-arm64), since the x86_64
      # wheel is not installable there. Pairing them here means adding a
      # platform is one obvious edit instead of an easily-missed branch.
      #
      # Not every built wheel has a runner to test on: linux-aarch64,
      # windows-x86, and (as of GitHub retiring free Intel macOS hosting
      # entirely -- every x64 macOS label is now a paid large-runner, e.g.
      # macos-15-intel/macos-14-large -- macos-x86_64) are shipped untested.
      # macos-13 used to cover the x86_64 wheel, but that label has no runner
      # left to schedule it on: the job just queues forever and gets
      # auto-cancelled by GitHub after 24h, which is what happened here.
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
          - os: windows-latest
            artifact: wheels-windows-x64
          # macos-latest tracks whatever Apple Silicon image GitHub currently
          # calls "latest", so it catches drift early.
          - os: macos-latest
            artifact: wheels-macos-aarch64
          # macos-15 is a hard-pinned Apple Silicon version (not a moving
          # "-latest" symlink), so this job stays reproducible even if/when
          # "latest" moves again.
          - os: macos-15
            artifact: wheels-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this OS's wheel
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifact }}
          path: dist
          merge-multiple: true
      # Fail loudly if the download produced nothing, rather than letting the
      # install step report a confusing "no matching distribution".
      - name: Verify a wheel was downloaded
        shell: bash
        run: |
          ls -l dist
          if [ "$(ls dist/*.whl 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "::error::no .whl in dist for ${{ matrix.artifact }}"
            exit 1
          fi
      # The distribution is `lapsed`; the command it installs is `deadcode`.
      # `--no-index` matters: this previously asked for `deadcode`, which does
      # not match the built `lapsed-*.whl`, so pip fell through to PyPI and
      # smoke-tested an unrelated package instead of this build. Forbidding the
      # index makes that failure loud rather than silent.
      - run: pip install --no-index --find-links dist lapsed
      - run: deadcode --version

  # Pushing a `v*` tag publishes to PyPI once every wheel built and smoke-tested.
  # Uses PyPI trusted publishing (OIDC), so there is no token in the repository:
  # register this workflow as a trusted publisher for `lapsed` on PyPI
  # (owner ColinKennedy, repo deadcode, workflow wheels.yml, environment pypi).
  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lapsed/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A tag that disagrees with Cargo.toml would upload the wrong version.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $actual"
            exit 1
          fi
          ls -l dist
          if ls dist | grep -v -E "^lapsed-$expected[-.]" ; then
            echo "::error::dist holds files that are not version $expected"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Every PyPI release gets a matching GitHub release carrying the same files.
  # Runs only after the upload succeeded, so a release never advertises a
  # version PyPI does not have. Re-running is safe: an existing release is
  # updated instead of failing.
  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
