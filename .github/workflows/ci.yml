name: CI

# Runs on every pull request regardless of base branch, and on v* tags.
#
# Deliberately NOT restricted to `branches: [main]` the way the older workflows
# are: this project develops through staging/test_release/feature branches, and
# a base-branch filter means a PR into anything but main gets no CI at all.
on:
  pull_request:
  push:
    tags: ["v*"]
  # Manual runs, useful for checking a branch before opening the PR.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the old run; tag builds are never
# cancelled, since those gate a release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failing check in one run, rather than hiding the rest
      # behind whichever fails first.
      fail-fast: false
      matrix:
        check: [fmt, clippy, test, ruff, ruff-format, mypy, privata]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the checks that need them, so the Python jobs stay lean.
          components: ${{ (matrix.check == 'fmt' && 'rustfmt') || (matrix.check == 'clippy' && 'clippy') || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.check }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # scripts/check.py pins the interpreter it hands to uv, but installing it
      # here means the Python jobs do not pay for a download on every run.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The exact command a developer runs locally.
      - run: python scripts/check.py ${{ matrix.check }}
