[package]
name = "deadcode"
version = "3.0.0"
edition = "2021"
rust-version = "1.74"
description = "Find and remove dead code in Python codebases."
license = "AGPL-3.0-only"
authors = ["Colin Kennedy <colinvfx@gmail.com>"]
repository = "https://github.com/albertas/deadcode"

[[bin]]
name = "deadcode"
path = "src/main.rs"

[lib]
name = "deadcode"
path = "src/lib.rs"

[dependencies]
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
regex = "1"
similar = "2"
once_cell = "1"
rayon = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
